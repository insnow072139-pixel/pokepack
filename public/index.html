<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon Card Pack</title><script src="/socket.io/socket.io.js"></script>
<style>
:root{--bg:#080b16;--panel:#11172a;--panel2:#171f37;--line:#2a3558;--gold:#ffd43b;--red:#ef5350;--blue:#55a7ff;--text:#f7f8ff;--muted:#9da8c7}
*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 50% -10%,#26366f 0,#0c1122 35%,#080b16 75%);min-height:100vh}button,input{font:inherit}button{border:0;cursor:pointer;border-radius:12px;font-weight:800}button:disabled{opacity:.45;cursor:not-allowed}
.top{position:sticky;top:0;z-index:20;background:rgba(8,11,22,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:13px 20px}.topin{max-width:1280px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:20px;font-weight:900;letter-spacing:-.5px}.logo span{color:var(--gold)}.wallet{background:#161e35;border:1px solid var(--line);padding:10px 15px;border-radius:14px}.wallet b{color:var(--gold)}
.wrap{max-width:1280px;margin:auto;padding:24px}.hero{border:1px solid #39466e;border-radius:24px;padding:28px;background:linear-gradient(135deg,#1c2750,#11182c 55%,#202b4d);box-shadow:0 20px 70px rgba(0,0,0,.28);margin-bottom:20px}.hero h1{margin:0 0 7px;font-size:32px}.hero p{margin:0;color:var(--muted)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chip{border:1px solid var(--line);padding:7px 10px;border-radius:99px;background:#0c1225;color:#cbd3eb;font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,2fr) 340px;gap:18px}.panel{background:rgba(17,23,42,.92);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:18px}.panel h2{margin:0 0 14px;font-size:19px}.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:13px}.pack{position:relative;overflow:hidden;background:linear-gradient(150deg,#1a2341,#10172b);border:1px solid #2d3960;border-radius:18px;padding:13px}.pack:before{content:"";position:absolute;inset:-60px auto auto -50px;width:150px;height:150px;background:rgba(255,212,59,.08);transform:rotate(35deg)}.packart{height:180px;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(145deg,#293b82,#121a35)}.packart:after{content:"";position:absolute;width:115px;height:155px;border-radius:13px;background:linear-gradient(145deg,#ffd43b,#ff8a00);box-shadow:0 12px 30px rgba(0,0,0,.35);transform:rotate(-7deg)}.packart:before{content:"POKÉMON";position:absolute;z-index:2;font-weight:1000;font-size:23px;color:#fff;text-shadow:0 2px 4px #14204d;transform:rotate(-7deg);top:62px}.packno{position:absolute;z-index:3;bottom:13px;right:14px;background:#080b16cc;border:1px solid #ffffff33;padding:4px 7px;border-radius:8px;font-size:11px}.pack h3{margin:11px 0 5px}.price{color:var(--gold);font-size:17px;font-weight:900}.sub{color:var(--muted);font-size:12px;margin:5px 0 11px}.open{width:100%;padding:11px;background:linear-gradient(180deg,#ffe66d,#ffc107);color:#15120a}.open:hover{filter:brightness(1.06)}
.openarea{min-height:410px;background:radial-gradient(circle at 50% 30%,#293760,#0e1426 55%);border-radius:18px;border:1px dashed #35436c;padding:20px;display:flex;align-items:center;justify-content:center}.stack{width:min(100%,720px);height:350px;position:relative}.stack .back{position:absolute;width:160px;height:230px;left:50%;top:35px;transform:translateX(-50%);border-radius:16px;background:linear-gradient(145deg,#ffcf33,#ef5350 55%,#3d6dff);border:7px solid #fff;box-shadow:0 18px 45px #0008}.stack .back:after{content:"★";position:absolute;inset:42px 36px;border:5px solid #fff;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:55px}.stack .hint{position:absolute;bottom:5px;width:100%;text-align:center;color:#aeb9d5}.reveal{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;width:100%}.revealCard{position:relative;background:#18213b;border:1px solid #3b4a73;border-radius:15px;padding:8px;animation:rise .45s ease both}.revealCard.last{border:2px solid var(--gold);box-shadow:0 0 28px rgba(255,212,59,.2)}.revealCard img{width:100%;height:245px;object-fit:contain;border-radius:9px;background:#090d19}.revealCard .rarity{color:var(--gold);font-weight:900}.sell{width:100%;margin-top:7px;padding:8px;background:#263252;color:#fff}.sell:hover{background:#34436a}@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:none}}
.online button{background:#1b2643;color:#fff;border:1px solid #344268;margin:4px;padding:9px 10px}.online button:hover{border-color:#6b83c4}.rankrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #26304d}.rankrow:last-child{border-bottom:0}.muted{color:var(--muted)}
.auth{min-height:100vh;display:grid;place-items:center;padding:25px}.authbox{width:min(430px,100%);background:rgba(17,23,42,.96);border:1px solid #35436a;border-radius:24px;padding:25px;box-shadow:0 25px 80px #0008}.authlogo{font-size:30px;font-weight:1000;text-align:center}.authlogo span{color:var(--gold)}.authbox p{color:var(--muted);text-align:center}.authbox input{width:100%;padding:13px;margin:5px 0;border-radius:11px;border:1px solid #303b5e;background:#0b1020;color:#fff;outline:none}.authbox input:focus{border-color:#6f89d1}.authbtn{width:100%;padding:13px;margin-top:8px;background:linear-gradient(180deg,#ffe66d,#ffc107)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:15px 0}.tabs button{padding:10px;background:#1b2541;color:#bdc7e0}.tabs .on{background:#ffd43b;color:#14120a}.hidden{display:none}.toast{position:fixed;right:18px;bottom:18px;z-index:99;background:#1b2541;border:1px solid #405078;padding:13px 16px;border-radius:13px;display:none;box-shadow:0 10px 30px #0008}.count{color:#9fb2e8;font-size:12px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.hero h1{font-size:26px}}@media(max-width:600px){.wrap{padding:13px}.packs{grid-template-columns:repeat(2,minmax(0,1fr))}.packart{height:145px}.reveal{grid-template-columns:repeat(2,minmax(0,1fr))}.revealCard img{height:210px}.top{padding:11px 13px}}
</style></head>
<body>
<div id="auth" class="auth"><div class="authbox"><div class="authlogo">🎴 <span>Pokémon</span> Card Pack</div><p>카드를 뽑고, 팔고, 더 좋은 팩에 도전하세요.</p><div class="tabs"><button id="lt" class="on" onclick="setMode('login')">로그인</button><button id="st" onclick="setMode('signup')">회원가입</button></div><input id="username" placeholder="닉네임"><input id="password" type="password" placeholder="비밀번호 (6자 이상)"><button class="authbtn" onclick="auth()">게임 시작</button></div></div>
<div id="game" class="hidden"><header class="top"><div class="topin"><div class="logo">🎴 <span>Pokémon</span> Card Pack</div><div class="wallet">💰 <b id="money">0</b>원</div></div></header>
<main class="wrap"><section class="hero"><h1>카드팩을 열어보세요</h1><p>앞쪽은 일반 카드, 마지막 한 장은 희귀 슬롯입니다. 팩 가격이 높을수록 마지막 카드의 고급 등급 확률이 올라갑니다.</p><div class="chips"><span class="chip">🎴 30종 팩</span><span class="chip">🃏 최대 15,000장</span><span class="chip">🖼️ TCGdex 이미지</span><span class="chip">🟢 실시간 서버</span></div></section>
<div class="layout"><div><section class="panel"><h2>📦 팩 상점 <span class="count" id="count"></span></h2><div id="packs" class="packs"></div></section><section class="panel"><h2>✨ 카드 공개</h2><div id="openarea" class="openarea"><div class="stack"><div class="back"></div><div class="hint">팩을 선택하면 카드가 준비됩니다</div></div></div></section><section class="panel"><h2>💼 내 카드 보관함</h2><div id="inventory" class="reveal"></div></section></div>
<aside><section class="panel"><h2>🟢 온라인 플레이어</h2><div id="online" class="online"><span class="muted">로그인 후 표시됩니다.</span></div></section><section class="panel"><h2>🏆 돈 랭킹</h2><div id="rank"></div></section></aside></div></main></div><div id="toast" class="toast"></div>
<script>
const socket=io();let mode='login',me=null;const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2200)}function setMode(m){mode=m;$('lt').classList.toggle('on',m==='login');$('st').classList.toggle('on',m==='signup')}
async function auth(){const username=$('username').value.trim(),password=$('password').value;if(!username||!password)return toast('닉네임과 비밀번호를 입력하세요.');const r=await fetch(mode==='signup'?'/api/signup':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const d=await r.json();if(!r.ok)return toast(d.error||'처리할 수 없습니다.');me=d;$('auth').classList.add('hidden');$('game').classList.remove('hidden');updateMe();socket.emit('join',{userId:me.id});loadPacks();loadInventory()}
function updateMe(){$('money').textContent=Number(me.money).toLocaleString()}
async function loadPacks(){const ps=await(await fetch('/api/packs')).json();$('packs').innerHTML=ps.map((p,i)=>`<article class="pack"><div class="packart"><span class="packno">PACK ${String(p.id).padStart(2,'0')}</span></div><h3>${p.name}</h3><div class="sub">🎴 ${p.count}장 · 마지막 희귀 보정 ×${p.rareBoost.toFixed(1)}</div><div class="price">${p.price.toLocaleString()}원</div><button class="open" onclick="openPack(${p.id})">팩 열기</button></article>`).join('');$('count').textContent='· 가격 낮은 순'}
function openPack(id){socket.emit('openPack',{packId:id});$('openarea').innerHTML='<div class="stack"><div class="back"></div><div class="hint">카드를 준비하는 중...</div></div>'}
function fallbackImage(imgs){let i=0;const img=new Image();img.alt='';img.decoding='async';img.loading='eager';img.onerror=()=>{i++;if(i<imgs.length)img.src=imgs[i];else img.style.visibility='hidden'};img.src=imgs[0]||'';return img}
function cardView(c,owned=false,index=0){const box=document.createElement('div');box.className='revealCard'+(index===6?' last':'');const img=fallbackImage(c.imageCandidates||[]);box.append(img);const name=document.createElement('div');name.innerHTML=`<b>${c.name||'카드'}</b>`;box.append(name);const rr=document.createElement('div');rr.className='rarity';rr.textContent=`${c.rarity||''} · ${Number(c.value||0).toLocaleString()}원`;box.append(rr);if(owned){const b=document.createElement('button');b.className='sell';b.textContent='판매';b.onclick=()=>socket.emit('sell',{inventoryId:c.id});box.append(b)}return box}
socket.on('packResult',d=>{me.money=d.money;updateMe();const area=$('openarea');area.innerHTML='';const grid=document.createElement('div');grid.className='reveal';d.cards.forEach((c,i)=>{grid.append(cardView(c,false,i));});area.append(grid);loadInventory()});
async function loadInventory(){if(!me)return;const xs=await(await fetch('/api/inventory/'+me.id)).json();const el=$('inventory');el.innerHTML='';if(!xs.length){el.innerHTML='<span class="muted">아직 보유 카드가 없습니다.</span>';return}xs.forEach(c=>el.append(cardView(c,true,-1)))}
socket.on('me',p=>{me=p;updateMe();loadInventory()});socket.on('leaderboard',xs=>{$('rank').innerHTML=xs.length?xs.map((p,i)=>`<div class="rankrow"><span>${i+1}. <b>${p.username}</b></span><span>${Number(p.money).toLocaleString()}원</span></div>`).join(''):'<span class="muted">아직 랭킹이 없습니다.</span>'});socket.on('online',xs=>{$('online').innerHTML=xs.length?xs.map(p=>`<button onclick="battle(${p.id})" ${p.id===me?.id?'disabled':''}>🟢 ${p.username} · ${p.wins}승</button>`).join(''):'<span class="muted">온라인 플레이어 없음</span>'});function battle(id){socket.emit('battleRequest',{targetId:id});toast('배틀 신청을 보냈습니다.')}
socket.on('battleRequest',b=>{if(confirm(`${b.from.username}님이 배틀을 신청했습니다. 수락할까요?`))socket.emit('battleAccept',{id:b.id})});socket.on('battleResult',r=>toast(r.winnerId===me?.id?'🏆 배틀 승리! +50,000원':'⚔️ 배틀이 끝났습니다.'));socket.on('errorMsg',toast);
</script></body></html>
